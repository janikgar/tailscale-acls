tagOwners:
  tag:k8s-operator:
    - autogroup:admin
  tag:k8s:
    - tag:k8s-operator
autoApprovers:
  services:
    tag:k8s:
      - tag:k8s
acls:
  - action: accept
    src:
      - '*'
    dst:
      - '*:*'
grants:
  - src:
      - '*'
    dst:
      - tag:k8s-operator
    ip:
      - tcp:443
nodeAttrs:
  - target:
      - tag:k8s
    attr:
      - funnel
